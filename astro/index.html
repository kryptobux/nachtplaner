<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#04060a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="symbol-192.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body style="margin:0"><title>Nachtplaner</title>
<meta name="description" content="Nachtplanung für Astrofotografie: Himmel, Horizont, Wetter und Ziele">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --bg:#04060a; --bg-rgb:4,6,10; --out:#020306;
  --panel:#0b1018; --panel-rgb:11,16,24; --panel-2:#131b28;
  --line:#1f2b3c; --line-2:#364962;
  --ink:#e9eef5; --ink-rgb:233,238,245; --ink-2:#aab7c9; --ink-3:#7f8fa6;
  --accent:#4fd8c4; --accent-rgb:79,216,196; --on-accent:#031a17;
  --warn:#e8b64d; --warn-rgb:232,182,77; --bad:#f2806c;
  --moon:#f1e8d0; --moon-rgb:241,232,208;
  --sky-0:#22456a; --sky-1:#142b48; --sky-2:#0a1728; --sky-3:#05080f;
  --glow-rgb:240,150,90; --cloud-rgb:150,165,185;
  --font-ui:'Barlow Semi Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --tab-h:58px; --dim:0;
  color-scheme:dark;
}
:root[data-theme="rot"]{
  --bg:#000; --bg-rgb:0,0,0; --out:#000;
  --panel:#0b0000; --panel-rgb:11,0,0; --panel-2:#170000;
  --line:#5a0000; --line-2:#8c0000;
  --ink:#f00; --ink-rgb:255,0,0; --ink-2:#e80000; --ink-3:#c80000;
  --accent:#f00; --accent-rgb:255,0,0; --on-accent:#000;
  --warn:#f00; --warn-rgb:255,0,0; --bad:#f00;
  --moon:#f00; --moon-rgb:255,0,0;
  --sky-0:#2a0000; --sky-1:#1a0000; --sky-2:#0c0000; --sky-3:#000;
  --glow-rgb:255,0,0; --cloud-rgb:210,0,0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.35;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:560px) and (min-height:740px){
  body{background:var(--out)}
  #app{width:412px;max-width:412px;height:min(915px,calc(100vh - 32px));margin:16px auto;border-radius:30px;border:1px solid var(--line-2);box-shadow:0 0 0 7px var(--panel)}
}
#dim{position:absolute;inset:0;background:#000;opacity:var(--dim);pointer-events:none;z-index:200}

/* ---------- Karte ---------- */
.stage{position:absolute;inset:0 0 var(--tab-h) 0;overflow:hidden}
.stage[hidden]{display:none}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none;user-select:none;-webkit-user-select:none}
#sky:active{cursor:grabbing}
#sky:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

.topbar{position:absolute;top:0;left:0;right:0;padding:8px 8px 0;display:flex;gap:6px;align-items:stretch;z-index:6;pointer-events:none}
.topbar>*{pointer-events:auto}
.pin{flex:none;width:44px;height:56px;border-radius:8px;border:1px solid var(--line-2);background:rgba(var(--panel-rgb),.9);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.nights{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.night{position:relative;height:56px;min-width:0;padding:5px 0 4px;border-radius:8px;border:1px solid var(--line);background:rgba(var(--panel-rgb),.9);color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.night b{font-weight:600;font-size:13px;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.night[aria-selected="true"]{border:2px solid var(--ink);background:var(--panel-2);padding:4px 0 3px}
.night[aria-selected="true"] b{font-weight:700}
.night .best{position:absolute;top:2px;right:3px;width:5px;height:5px;background:var(--accent);transform:rotate(45deg)}
.topbar .seg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:rgba(var(--panel-rgb),.9)}
.seg button,.segc button{min-height:44px;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;padding:0 10px}
.seg button[aria-pressed="true"],.segc button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.topbar .lbl{flex:none;display:flex;align-items:center;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(var(--panel-rgb),.9);font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.topbar .grp-n,.topbar .grp-h{display:contents}
.stage:not([data-mode="nacht"]) .grp-n{display:none}
.stage[data-mode="nacht"] .grp-h{display:none}

.fabs{position:absolute;top:72px;display:flex;flex-direction:column;gap:6px;z-index:5}
.fabs.r{right:8px}.fabs.l{left:8px}
.stage[data-mode="himmel"] .fabs{top:72px}
.fab{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-2);background:rgba(var(--panel-rgb),.9);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.fab[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 -3px 0 var(--ink)}
.fab svg,.pin svg,.tab svg{pointer-events:none}
.pop{position:absolute;left:60px;top:72px;z-index:7;width:min(292px,calc(100% - 76px));background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:10px 10px 12px}
.pop[hidden]{display:none}
.pop h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pop .chips{display:flex;flex-wrap:wrap;gap:6px}
.pop .legend{display:grid;grid-template-columns:34px 1fr;gap:6px 8px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink-2)}
.moonTip{position:absolute;z-index:4;pointer-events:none;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:13px;white-space:nowrap}
.moonTip[hidden]{display:none}
.hint{position:absolute;top:80px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;font-size:12px;color:var(--ink-3);background:rgba(var(--bg-rgb),.7);padding:3px 8px;border-radius:6px;white-space:nowrap}

/* ---------- Sheet ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;height:132px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;display:flex;flex-direction:column;z-index:10;overflow:hidden}
.sheet-head{flex:none;touch-action:none;cursor:grab}
.grab{display:block;width:100%;height:26px;border:0;background:none;padding:0;position:relative;touch-action:none}
.grab::before{content:"";position:absolute;left:50%;top:10px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line-2)}
.headline{display:flex;align-items:center;gap:8px;padding:0 4px 0 16px;height:46px}
.headline .ht{flex:1;min-width:0}
.headline .ht b{display:block;font-size:17px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headline .ht span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headline .clock{font-family:var(--font-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.headline .sz{flex:none;width:44px;height:44px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center}
.scrub{flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 8px;height:60px}
.step{flex:none;width:46px;height:48px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--ink);padding:0}
.step.play{width:44px}
#slider{position:relative;flex:1;min-width:0;height:52px;touch-action:none;cursor:ew-resize;outline:none;border-radius:6px}
#slider:focus-visible{outline:2px solid var(--ink)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:2px 16px 28px;-webkit-overflow-scrolling:touch}

/* ---------- Seiten ---------- */
.page{position:absolute;inset:0 0 var(--tab-h) 0;overflow-y:auto;overflow-x:hidden;background:var(--bg);z-index:8;overscroll-behavior:contain}
.page[hidden]{display:none}
.page-in{padding:14px 16px 90px}
.page h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.005em;line-height:1.1}
.page .sub{margin:2px 0 12px;color:var(--ink-2);font-size:14px}
.sticky{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.sticky h1{font-size:24px}

.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tab-h);display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);z-index:30}
.tab{position:relative;border:0;background:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:600;min-height:44px;padding:4px 0 2px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--ink)}

/* ---------- Bauteile ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink);border-color:var(--ink)}
.chip svg{flex:none}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ico{min-width:44px;min-height:44px;padding:0;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center}
[data-theme="rot"] .btn.primary{background:var(--panel-2);color:var(--ink);border:2px solid var(--ink)}
[data-theme="rot"] body,[data-theme="rot"] .sheet-body{font-size:16px}
[data-theme="rot"] .dense{display:none!important}
[data-theme="rot"] .night b,[data-theme="rot"] .tab,[data-theme="rot"] .chip{font-weight:700}
.sec{margin:18px 0 0}
.sec>h2{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--ink-2);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec>h2 small{font-size:13px;font-weight:500;color:var(--ink-3)}
.rule{border:0;border-top:1px solid var(--line);margin:16px 0 0}
.note{font-size:13px;color:var(--ink-3);line-height:1.4;margin:6px 0 0}
.warnbox{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--warn);border-left-width:4px;border-radius:6px;padding:9px 11px;font-size:14px;margin:10px 0 0;background:rgba(var(--warn-rgb),.07)}
.warnbox svg{flex:none;margin-top:1px}
[data-theme="rot"] .warnbox{border-style:dashed}
details>summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin:0 4px 0 2px;transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.list li b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:13px}

/* Urteil */
.verdict{display:flex;gap:14px;align-items:flex-end;margin-top:6px}
.verdict .word{font-size:40px;font-weight:600;line-height:.95;letter-spacing:-.01em}
.verdict .lv{margin-bottom:4px}
.verdict-sub{margin:8px 0 0;font-size:16px;line-height:1.35}
.verdict-sub2{margin:4px 0 0;font-size:14.5px;color:var(--ink-2);line-height:1.38}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font-size:13.5px;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:600}
.how{font-size:12.5px;color:var(--ink-3);margin-top:8px}

/* Diagramme */
.chart{width:100%;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.chart text{font-family:var(--font-mono);font-size:10.5px;fill:var(--ink-3)}
.chart .lane{font-family:var(--font-ui);font-size:12px;font-weight:500;fill:var(--ink-2)}
.chart .tag{fill:var(--ink);font-size:11px;font-weight:500}
.readout{margin:8px 0 0;font-size:14px;color:var(--ink-2);line-height:1.45;min-height:40px}
.readout b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:13.5px}
.hint2{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.hint2 svg{flex:none;margin-top:1px}
.hint2 b{font-weight:600}
.hint2 span{color:var(--ink-2)}

/* Zielzeilen */
.tgt{display:flex;gap:10px;align-items:center;width:100%;min-height:68px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.tgt .tx{flex:1;min-width:0}
.tgt .nm{display:block;font-size:16px;font-weight:600;line-height:1.2}
.tgt .mt{display:block;font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.3}
.tgt .mt b{font-family:var(--font-mono);font-weight:500;font-size:12.5px;color:var(--ink)}
.tgt svg.sp{flex:none}
.tgt[aria-pressed="true"]{box-shadow:inset 3px 0 0 var(--ink);padding-left:10px}
.tgt.off{opacity:.62}
.tgt.big{display:block;padding:10px 0 12px;min-height:0}
.tgt.big .nm{font-size:19px}
.tgt.big svg.sp{margin-top:8px;width:100%}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.rank{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}

/* Detail */
.td-top{display:flex;align-items:flex-start;gap:8px;margin-top:2px}
.td-top h2{flex:1;margin:4px 0 0;font-size:24px;font-weight:600;line-height:1.1}
.td-top .cat{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-top:4px;display:block;font-weight:400}
.acts{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin:12px 0 0}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0 0}
.dl div{border-left:2px solid var(--line-2);padding-left:9px}
.dl dt{font-size:12.5px;color:var(--ink-3);margin:0}
.dl dd{margin:0;font-size:17px;font-weight:600;line-height:1.2}
.dl dd small{font-size:13px;font-weight:500;color:var(--ink-2)}
.fov svg{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.rng{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--ink-2)}
.rng input{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11.5px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
input[type=range]::-moz-range-track{height:3px;background:var(--line-2);border-radius:2px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}

.detail{position:absolute;left:0;right:0;bottom:0;height:88%;z-index:40;background:var(--panel);border:1px solid var(--line-2);border-bottom:0;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.detail[hidden],.scrim[hidden]{display:none}
.detail .sheet-body{padding-top:0}
.scrim{position:absolute;inset:0;z-index:39;background:rgba(0,0,0,.55);border:0}

/* Formulare */
.field{display:block;margin:10px 0 0}
.field>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.in{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);padding:0 12px;font-size:16px}
.in:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.in.mono{font-family:var(--font-mono);font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.loc{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);min-height:64px}
.loc .pick{flex:1;min-width:0;min-height:64px;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:6px 0}
.loc .pick b{display:block;font-size:16px;font-weight:600}
.loc .pick small{display:block;font-size:13px;color:var(--ink-2);font-family:var(--font-mono)}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.loc [aria-checked="true"] .radio{border-color:var(--ink)}
.loc [aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.parsed{font-size:13.5px;margin-top:6px;min-height:20px}
.parsed.ok{color:var(--ink)}
.parsed.no{color:var(--warn)}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:12px 0 0}
.kvs div{border-top:1px solid var(--line-2);padding-top:5px}
.kvs dt{font-size:12.5px;color:var(--ink-3);margin:0}
.kvs dd{margin:0;font-family:var(--font-mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.kvs dd small{font-family:var(--font-ui);font-size:13px;color:var(--ink-2)}

.toast{position:absolute;left:12px;right:12px;bottom:calc(var(--tab-h) + 12px);z-index:60;background:var(--panel-2);border:2px solid var(--ink);border-radius:10px;padding:11px 14px;font-size:15px;font-weight:500}
.toast[hidden]{display:none}

/* Plan */
.pbar-handle{cursor:ew-resize}
.confl{margin:10px 0 0;padding:0;list-style:none}
.confl li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.confl li svg{flex:none;margin-top:2px}
.pitem{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin:8px 0 0;background:var(--panel)}
.pitem[aria-current="true"]{border:2px solid var(--ink);padding:9px 11px}
.pitem .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pitem .r1 b{font-size:16px;font-weight:600}
.pitem .r2{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.pitem .r2 .btn{min-height:44px;min-width:44px;padding:0 8px;font-family:var(--font-mono);font-size:13px}

function autoPlan(V){

    else t+=15;

    s1:'Ohne Wetter · '+fmtH(b.useH)+' nutzbar',s2:'nur Astronomie · '+dl};}

/* ---------- Selbstprüfung der Rechnung (Astronomy Engine gegen vorberechnete Werte) ---------- */

    dA=Math.max(dA,Math.abs(r.alt-z.hoehe_15min[k]));
    const da=Math.abs(((r.az-z.azimut_15min[k]+540)%360)-180);dZ=Math.max(dZ,da);dS=Math.max(dS,da*Math.cos(z.hoehe_15min[k]*D2R));cnt++;

/* =========================================================
   Teil 2: Himmelskarte (Canvas), Kamera, Gesten, Wolkenschleier
   ========================================================= */
const cv=$('#sky'),ctx=cv.getContext('2d');
let CW=300,CH=500,DPR=1,dirty=true,tNow=0,lastDraw=0,uiDirty=true;
let sheetH=132,sheetTarget=132;
const PAL={};

let hatchPat=null;

  PAL.bg=g('--bg');PAL.bgRGB=g('--bg-rgb');PAL.ink=g('--ink');PAL.inkRGB=g('--ink-rgb');PAL.ink2=g('--ink-2');PAL.ink3=g('--ink-3');

/* ---------- Sterne, Linien, Namen ---------- */
let SV,SM,SB,SHE,SHN,SHU,LINES=[],NAMES=[];
function vecRD(ra,dec,out,o){const cd=Math.cos(dec*D2R);out[o]=cd*Math.cos(ra*D2R);out[o+1]=cd*Math.sin(ra*D2R);out[o+2]=Math.sin(dec*D2R);}
function prepStars(){
  const st=H.sterne,n=st.length;
  SV=new Float32Array(n*3);SM=new Float32Array(n);SHE=new Float32Array(n);SHN=new Float32Array(n);SHU=new Float32Array(n);
  SB=[[],[],[],[],[]];
  for(let i=0;i<n;i++){vecRD(st[i][0],st[i][1],SV,i*3);SM[i]=st[i][2];const m=st[i][2];SB[m<1.5?0:m<2.5?1:m<3.5?2:m<4.5?3:4].push(i);}
  LINES=H.linien.map(l=>{const a=new Float32Array(l.length*3);l.forEach((p,i)=>vecRD(p[0],p[1],a,i*3));return {v:a,n:l.length,ok:new Uint8Array(l.length),x:new Float32Array(l.length),y:new Float32Array(l.length)};});
  NAMES=H.namen.map(x=>{const a=new Float32Array(3);vecRD(x[1],x[2],a,0);return {name:x[0],v:a};});
  /* Milchstraße: fünf Helligkeitsstufen als Ringe (d3-celestial), je Stufe übereinander halbtransparent gefüllt */
  MW=(NP.milchstrasse?NP.milchstrasse.stufen:[]).map(st=>st.map(r=>{const a=new Float32Array(r.length*3);r.forEach((p,i)=>vecRD(p[0],p[1],a,i*3));return a;}));
}
let MW=[];

/* ---------- Kamera (stereografisch) ---------- */
const cam=S.cam;
const ptrs=new Map();
let B={fx:0,fy:0,fz:1,ux:0,uy:-1,uz:0,rx:1,ry:0},SC=100,CX=200,CY=250,baseS=100,VR={x:0,y:72,w:300,h:300};
function camBasis(az0,alt0){const a=alt0*D2R,A=az0*D2R,ca=Math.cos(a),sa=Math.sin(a),sA=Math.sin(A),cA=Math.cos(A);
  return {fx:ca*sA,fy:ca*cA,fz:sa,ux:-sa*sA,uy:-sa*cA,uz:ca,rx:cA,ry:-sA};}
function topInset(){return S.tab==='nacht'?72:62;}
function layoutCam(){
  VR={x:0,y:topInset(),w:CW,h:Math.max(90,CH-topInset()-sheetH)};
  const R=Math.max(40,Math.min(CW/2-30,VR.h/2-22));
  baseS=R/2;SC=baseS*cam.zoom;CX=VR.x+VR.w/2;CY=VR.y+VR.h/2;if(S.view==='pano'&&!ptrs.size){const p=panoParams();if(S.camT){S.camT.alt0=p.alt0;S.camT.zoom=p.zoom;}else{cam.alt0=p.alt0;cam.zoom=p.zoom;}SC=baseS*cam.zoom;}
  B=camBasis(cam.az0,cam.alt0);
}
const PXY={x:0,y:0};
function pr(e,n,u){
  const c=e*B.fx+n*B.fy+u*B.fz;if(c<-0.97)return false;
  const k=2/(1+c);PXY.x=CX+SC*k*(e*B.rx+n*B.ry);PXY.y=CY-SC*k*(e*B.ux+n*B.uy+u*B.uz);return true;
}
function prc(e,n,u){ /* geklemmt, für Flächen */
  const c=e*B.fx+n*B.fy+u*B.fz;const k=2/(1+Math.max(c,-0.985));
  let x=SC*k*(e*B.rx+n*B.ry),y=-SC*k*(e*B.ux+n*B.uy+u*B.uz);
  const r=Math.hypot(x,y),L=9000;if(r>L){x*=L/r;y*=L/r;}
  PXY.x=CX+x;PXY.y=CY+y;return true;
}
function hv(alt,az){const a=alt*D2R,b=az*D2R,c=Math.cos(a);return [c*Math.sin(b),c*Math.cos(b),Math.sin(a)];}
function unproject(px,py){
  const X=(px-CX)/SC,Y=(CY-py)/SC,rho=Math.hypot(X,Y);
  if(rho<1e-9)return [B.fx,B.fy,B.fz];
  const c=2*Math.atan(rho/2),cc=Math.cos(c),sc=Math.sin(c),xr=X/rho,yr=Y/rho;

function projCam(az0,alt0,w,o){
  const b=camBasis(az0,alt0),c=w[0]*b.fx+w[1]*b.fy+w[2]*b.fz,k=2/(1+Math.max(c,-0.98));
  o[0]=CX+SC*k*(w[0]*b.rx+w[1]*b.ry);o[1]=CY-SC*k*(w[0]*b.ux+w[1]*b.uy+w[2]*b.uz);
}
function grabSolve(w,px,py){
  const o=[0,0],o1=[0,0],o2=[0,0];
  for(let it=0;it<6;it++){
    projCam(cam.az0,cam.alt0,w,o);const ex=px-o[0],ey=py-o[1];if(ex*ex+ey*ey<0.2)break;
    const eps=0.6;projCam(cam.az0+eps,cam.alt0,w,o1);projCam(cam.az0,cam.alt0+eps,w,o2);
    const j11=(o1[0]-o[0])/eps,j21=(o1[1]-o[1])/eps,j12=(o2[0]-o[0])/eps,j22=(o2[1]-o[1])/eps;
    let a=j11*j11+j21*j21,b=j11*j12+j21*j22,c=j12*j12+j22*j22;const lam=0.05*(a+c)+1e-6;a+=lam;c+=lam;

  }

}
function panoParams(){
  const R=Math.max(40,Math.min(CW/2-30,VR.h/2-22)),bs=R/2,sc=CW/2*0.98/(2*Math.tan(25*D2R));
  return {az0:212,alt0:clamp(2*Math.atan(0.44*VR.h/(2*sc))*R2D,24,68),zoom:sc/bs};
}
function presetOf(v){if(v==='polar')return {az0:212,alt0:90,zoom:1};if(v==='pano'){layoutCam();return panoParams();}return null;}
function viewFree(){
  if(S.view==='frei')return;
  const p=S.view==='polar'?{az0:212,alt0:90,zoom:1}:panoParams();
  if(Math.abs(cam.zoom/p.zoom-1)>0.04||Math.abs(cam.alt0-p.alt0)>2||(p.alt0<89&&Math.abs(((cam.az0-p.az0+540)%360)-180)>3)){S.view='frei';syncViewButtons();}
}
function setView(v){
  S.view=v;S.follow=false;const p=presetOf(v);moveCam(p.az0,p.alt0,p.zoom,false);syncViewButtons();
}
function moveCam(az,alt,zoom,follow){
  S.follow=!!follow;
  if(reduced()&&!follow){cam.az0=az;cam.alt0=alt;cam.zoom=zoom;S.camT=null;dirty=true;return;}
  S.camT={az0:az,alt0:alt,zoom:zoom};
}
function stepCam(dt){
  const T=S.camT;if(!T)return;
  const k=1-Math.exp(-dt*(S.follow?7:9));

  cam.az0=(cam.az0+da*k+360)%360;cam.alt0+= (T.alt0-cam.alt0)*k;

}
function followUpdate(){
  if(!S.follow||S.sel==null||!NV)return;
  const T=NV.targets[S.sel];
  const alt=lerpArr(T.alt,S.t),az=lerpAz(T.az,S.t);
  S.camT={az0:az,alt0:clamp(alt,6,90),zoom:S.camT?S.camT.zoom:cam.zoom};

/* ---------- Wolkenschleier ---------- */
let CLAYERS=null,cloudRGBKey='',cloudCover=0;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeNoise(N,seed){
  const rnd=mulberry(seed),out=new Float32Array(N*N);let amp=1,tot=0;
  for(let o=0,g=4;o<5;o++,g*=2){
    const lat=new Float32Array(g*g);for(let i=0;i<lat.length;i++)lat[i]=rnd();
    for(let y=0;y<N;y++){const fy=y/N*g,y0=Math.floor(fy),ty=fy-y0,sy=ty*ty*(3-2*ty);
      for(let x=0;x<N;x++){const fx=x/N*g,x0=Math.floor(fx),tx=fx-x0,sx=tx*tx*(3-2*tx);
        const a=lat[(y0%g)*g+(x0%g)],b=lat[(y0%g)*g+((x0+1)%g)],c=lat[((y0+1)%g)*g+(x0%g)],d=lat[((y0+1)%g)*g+((x0+1)%g)];
        out[y*N+x]+=amp*(lerp(lerp(a,b,sx),lerp(c,d,sx),sy));}}
    tot+=amp;amp*=0.55;
  }
  for(let i=0;i<out.length;i++)out[i]/=tot;
  return out;
}
function initClouds(){
  CLAYERS=[{key:'tief',seed:11,scale:3.6,sp:[9,3],maxA:.62},{key:'mittel',seed:23,scale:3.0,sp:[16,-4],maxA:.46},{key:'hoch',seed:37,scale:4.4,sp:[26,5],maxA:.26}].map(L=>{
    L.N=112;L.noise=makeNoise(L.N,L.seed);L.sorted=Float32Array.from(L.noise).sort();
    L.cv=document.createElement('canvas');L.cv.width=L.cv.height=L.N;L.cx=L.cv.getContext('2d');L.cover=-1;return L;});
}
function updateCloudLayer(L,cover){
  const key=PAL.cloudRGB.join(',');
  if(Math.abs(cover-L.cover)<0.012&&L.rgb===key)return;
  L.cover=cover;L.rgb=key;
  const thr=cover<=0.001?2:cover>=0.999?-1:L.sorted[Math.floor((1-cover)*(L.sorted.length-1))];
  const img=L.cx.createImageData(L.N,L.N),d=img.data,rgb=PAL.cloudRGB,mA=L.maxA*(PAL.rot?.75:1);
  for(let i=0;i<L.noise.length;i++){
    const v=L.noise[i],a=smooth(thr-0.05,thr+0.08,v)*(0.5+0.5*smooth(0.25,0.8,v))*mA;
    d[i*4]=rgb[0];d[i*4+1]=rgb[1];d[i*4+2]=rgb[2];d[i*4+3]=Math.round(clamp(a,0,1)*255);
  }
  L.cx.putImageData(img,0,0);
}
function drawClouds(){
  const tt=S.t,covers={tief:hourLin(N,'tief',tt)/100,mittel:hourLin(N,'mittel',tt)/100,hoch:hourLin(N,'hoch',tt)/100};
  cloudCover=Math.max(covers.tief,covers.mittel,covers.hoch)*100;
  const drift=!reduced();ctx.imageSmoothingEnabled=true;
  for(const L of CLAYERS){
    const c=covers[L.key];if(c<0.02)continue;
    updateCloudLayer(L,c);
    const T=L.N*L.scale,ox=drift?((tNow/1000)*L.sp[0])%T:0,oy=drift?((tNow/1000)*L.sp[1]%T+T)%T:0;
    for(let x=-ox-T;x<CW;x+=T)for(let y=-oy-T;y<CH;y+=T)ctx.drawImage(L.cv,x,y,T,T);
  }
}

/* ---------- Zeichnen ---------- */
let HITS=[],MOONPOS=null;
const labelRects=[];
function polyPath(path,pts){pts.forEach((p,i)=>i?path.lineTo(p[0],p[1]):path.moveTo(p[0],p[1]));path.closePath();}
function horizonPts(){const a=[];for(let az=0;az<360;az+=2){const v=hv(0,az);prc(v[0],v[1],v[2]);a.push([PXY.x,PXY.y]);}return a;}
/* Linie des Horizontprofils; verdeckte Richtungen laufen bis zum Zenit, an harten Kanten senkrecht */
function windowPts(){
  const a=[],add=(al,az)=>{const v=hv(Math.min(al,90),az);prc(v[0],v[1],v[2]);a.push([PXY.x,PXY.y]);};
  for(let az=0;az<360;az+=1){
    const h=hzAt(az),hn=hzAt(az+1);add(h,az);
    if(h>=90&&hn<90)for(let al=90;al>hn;al-=6)add(al,az+1);
    else if(h<90&&hn>=90)for(let al=h;al<90;al+=6)add(al,az);
  }
  return a;
}
/* Azimute, an denen das Profil zwischen verdeckt und frei wechselt (für die Beschriftung am Rand) */
function hzEdges(){const e=[];for(let az=0;az<360;az+=5){if((hzAt(az)>=90)!==(hzAt(az+5)>=90))e.push(hzAt(az)>=90?az+5:az);}return e;}
function skyColor(a){
  const s=PAL.sky;
  if(a>=4)return 'rgb('+s[0].join(',')+')';
  if(a>=-6)return mixc(s[0],s[1],(4-a)/10);
  if(a>=-12)return mixc(s[1],s[2],(-6-a)/6);
  if(a>=-18)return mixc(s[2],s[3],(-12-a)/6);
  return 'rgb('+s[3].join(',')+')';
}
function ringPath(alt,step){
  const p=new Path2D();let pen=false;
  for(let az=0;az<=360;az+=step){const v=hv(alt,az);if(pr(v[0],v[1],v[2])){if(pen)p.lineTo(PXY.x,PXY.y);else{p.moveTo(PXY.x,PXY.y);pen=true;}}else pen=false;}
  return p;
}
function drawText(txt,x,y,font,fill,align,halo){
  ctx.font=font;ctx.textAlign=align||'left';ctx.textBaseline='middle';
  if(halo){ctx.lineWidth=3;ctx.strokeStyle='rgba('+PAL.bgRGB+',.85)';ctx.lineJoin='round';ctx.strokeText(txt,x,y);}
  ctx.fillStyle=fill;ctx.fillText(txt,x,y);
}
function labelFree(x,y,w,h){
  for(const r of labelRects){if(x<r[0]+r[2]&&x+w>r[0]&&y<r[1]+r[3]&&y+h>r[1])return false;}
  labelRects.push([x,y,w,h]);return true;
}
function trackSegs(T,k0,k1){
  const segs=[];let seg=null,last=null;
  for(let k=k0;k<=k1;k++){
    const t=k*15;
    if(T.alt[k]<-0.5||!pr(T.vec[k*3],T.vec[k*3+1],T.vec[k*3+2])){seg=null;last=null;continue;}
    const st=inWins(T.win,t)?(cloudClear(N,t)?2:1):0;
    const p={x:PXY.x,y:PXY.y,t};
    if(!seg||seg.st!==st){seg={st,pts:last?[last]:[]};segs.push(seg);}
    seg.pts.push(p);last=p;
  }
  return segs;
}
function strokeSegs(segs,filter,style){
  ctx.beginPath();
  for(const s of segs){if(!filter(s.st)||s.pts.length<2)continue;s.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));}
  Object.assign(ctx,style.props);ctx.setLineDash(style.dash||[]);ctx.stroke();ctx.setLineDash([]);
}

function draw(){
  if(!NV||!SV)return;
  const t=S.t,ms=NV.ms0+t*60000;
  calcMatrix(ms);
  layoutCam();
  const sunAlt=lerpArr(N.sonne_hoehe_15min,t);
  const sw=PAL.sw;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,CW,CH);
  labelRects.length=0;HITS=[];MOONPOS=null;

  const hp=horizonPts(),skyP=new Path2D();polyPath(skyP,hp);
  ctx.save();ctx.clip(skyP);
  ctx.fillStyle=skyColor(sunAlt);ctx.fillRect(0,0,CW,CH);

  /* Dämmerungsglut an der Sonnenstelle */
  {
    const g=0.55*Math.exp(-Math.pow((sunAlt+3)/8.5,2))*(PAL.rot?.55:1);
    if(g>0.01){const sv=hv(Math.max(sunAltE,-30),sunAz);prc(sv[0],sv[1],sv[2]);
      const rad=SC*1.5,gr=ctx.createRadialGradient(PXY.x,PXY.y,0,PXY.x,PXY.y,rad);
      gr.addColorStop(0,'rgba('+PAL.glowRGB+','+g+')');gr.addColorStop(1,'rgba('+PAL.glowRGB+',0)');
      ctx.fillStyle=gr;ctx.fillRect(0,0,CW,CH);}
  }
  /* Mondlicht */
  const mAlt=lerpArr(N.mond.hoehe_15min,t),mAz=lerpAz(N.mond.azimut_15min,t),illum=N.mond.beleuchtet_prozent/100;
  if(mAlt>-3){
    const mv=hv(mAlt,mAz);prc(mv[0],mv[1],mv[2]);
    const a=0.26*illum*smooth(-3,14,mAlt)*(PAL.rot?.6:1);
    if(a>0.008){const rad=SC*1.1,gr=ctx.createRadialGradient(PXY.x,PXY.y,0,PXY.x,PXY.y,rad);
      gr.addColorStop(0,'rgba('+PAL.moonRGB+','+a+')');gr.addColorStop(1,'rgba('+PAL.moonRGB+',0)');ctx.fillStyle=gr;ctx.fillRect(0,0,CW,CH);}
  }
  /* Gitter */
  if(S.layers.grid){
    ctx.lineWidth=1*sw;ctx.strokeStyle='rgba('+PAL.inkRGB+','+(PAL.rot?.22:.09)+')';
    ctx.stroke(ringPath(60,6));
    ctx.setLineDash([4,5]);ctx.strokeStyle='rgba('+PAL.inkRGB+','+(PAL.rot?.3:.14)+')';ctx.stroke(ringPath(30,4));ctx.setLineDash([]);
    ctx.strokeStyle='rgba('+PAL.inkRGB+','+(PAL.rot?.18:.07)+')';ctx.beginPath();
    for(let az=0;az<360;az+=45){let pen=false;for(let al=0;al<=90;al+=6){const v=hv(al,az);if(pr(v[0],v[1],v[2])){pen?ctx.lineTo(PXY.x,PXY.y):ctx.moveTo(PXY.x,PXY.y);pen=true;}else pen=false;}}
    ctx.stroke();
  }
  /* Sterne: Grenzgröße aus Dämmerung und Mond */
  const lim=lerp(5.4,0.6,smooth(-17,-5,sunAlt))-1.7*illum*smooth(-2,25,mAlt)*0.9;
  /* Milchstraße: nur bei dunklem Himmel sichtbar; Mond und Dämmerung blenden sie über die Grenzgröße aus */
  if(S.layers.mw&&MW.length){
    const ma=smooth(3.2,5.2,lim)*(PAL.rot?.12:.1);
    if(ma>0.004){
      ctx.fillStyle='rgba('+PAL.inkRGB+','+ma.toFixed(3)+')';
      for(const st of MW){
        const p=new Path2D();
        for(const v of st){
          for(let j=0,n=v.length/3;j<n;j++){
            const x=v[j*3],y=v[j*3+1],z=v[j*3+2];
            prc(-(MAT[3]*x+MAT[4]*y+MAT[5]*z),MAT[0]*x+MAT[1]*y+MAT[2]*z,MAT[6]*x+MAT[7]*y+MAT[8]*z);

/* ---------- Höhenkurven ---------- */
function hzTrack(T){const a=[];for(let k=0;k<65;k++)a.push(Math.min(90,hzAt(T.az[k])));return a;}
function spark(T,w,h){
  const X=t=>t/960*w,Y=a=>h-2-clamp(a,0,90)/90*(h-5);
  let s='<svg class="sp" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">';
  s+='<rect x="'+X(NV.d0).toFixed(1)+'" y="0" width="'+(X(NV.d1)-X(NV.d0)).toFixed(1)+'" height="'+h+'" style="fill:rgba(var(--ink-rgb),.07)"/>';
  s+='<polyline fill="none" points="'+hzTrack(T).map((a,k)=>X(k*15).toFixed(1)+','+Y(a).toFixed(1)).join(' ')+'" style="stroke:var(--ink-3)" stroke-dasharray="3 3" stroke-width="1"/>';
  s+='<polyline fill="none" style="stroke:var(--ink-3)" stroke-width="1.2" points="'+T.alt.map((a,k)=>X(k*15).toFixed(1)+','+Y(a).toFixed(1)).join(' ')+'"/>';
  for(const [a,b] of T.win){
    const pts=[];for(let t=a;t<=b;t+=5)pts.push([X(t),Y(lerpArr(T.alt,t))]);pts.push([X(b),Y(lerpArr(T.alt,b))]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
    s+='<path d="'+d+'L'+X(b).toFixed(1)+' '+(h-2)+'L'+X(a).toFixed(1)+' '+(h-2)+'Z" style="fill:var(--accent)" fill-opacity=".26"/><path d="'+d+'" fill="none" style="stroke:var(--accent)" stroke-width="2.4"/>';
  }
  s+='<line class="spc" x1="0" x2="0" y1="0" y2="'+h+'" style="stroke:var(--ink)" stroke-width="1.2" data-w="'+w+'"/>';
  return s+'</svg>';
}

  s+='<rect x="'+X(NV.d0).toFixed(1)+'" y="'+y0+'" width="'+(X(NV.d1)-X(NV.d0)).toFixed(1)+'" height="'+(y1-y0)+'" style="fill:rgba(var(--ink-rgb),.06)"/>';
  [0,30,60,90].forEach(a=>{s+='<line x1="'+pl+'" x2="'+(pl+pw)+'" y1="'+Y(a).toFixed(1)+'" y2="'+Y(a).toFixed(1)+'" style="stroke:var(--line)"/><text x="'+(pl-4)+'" y="'+(Y(a)+3.5).toFixed(1)+'" text-anchor="end">'+a+'°</text>';});
  for(let k=0;k<=8;k++)s+='<text x="'+X(k*120).toFixed(1)+'" y="'+(H_-4)+'" text-anchor="middle">'+pad2((16+2*k)%24)+'</text>';
  // Fenster
  for(const [a,b] of T.win)s+='<rect x="'+X(a).toFixed(1)+'" y="'+y0+'" width="'+(X(b)-X(a)).toFixed(1)+'" height="'+(y1-y0)+'" style="fill:var(--accent)" fill-opacity=".12"/>';
  // Maske
  {const hp=hzTrack(T).map((a,k)=>[X(k*15),Y(a)]),d=hp.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
   s+='<path d="'+d+'L'+(pl+pw)+' '+y1+'L'+pl+' '+y1+'Z" fill="url(#hatchA)" fill-opacity=".45"/><path d="'+d+'" fill="none" style="stroke:var(--ink-2)" stroke-width="1.4"/><text x="'+(pl+pw-2)+'" y="'+(y0+11)+'" text-anchor="end">Horizont in Zielrichtung</text>';}
  // Mond
  {const pts=[];for(let k=0;k<65;k++)pts.push(X(k*15).toFixed(1)+','+Y(N.mond.hoehe_15min[k]).toFixed(1));
   s+='<polyline fill="none" style="stroke:var(--moon)" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round" points="'+pts.join(' ')+'"/>';}
  // Kurve nach Zustand
  {let seg=null,segs=[];
   for(let t=0;t<=960;t+=5){const st=inWins(T.win,t)?(cloudClear(N,t)?2:1):0,p=[X(t),Y(lerpArr(T.alt,t))];
     if(!seg||seg.st!==st){const prev=seg?seg.pts[seg.pts.length-1]:null;seg={st,pts:prev?[prev]:[]};segs.push(seg);}seg.pts.push(p);}
   const st=[{c:'var(--ink-3)',w:1.4,d:''},{c:'var(--warn)',w:3,d:' stroke-dasharray="6 4"'},{c:'var(--accent)',w:3.4,d:''}];
   for(const sg of segs){if(sg.pts.length<2)continue;s+='<path d="'+sg.pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')+'" fill="none" style="stroke:'+st[sg.st].c+'" stroke-width="'+st[sg.st].w+'"'+st[sg.st].d+' stroke-linejoin="round"/>';}}
  // Wolkenstreifen

function tdReadHTML(T,t){

/* ---------- Bildfeld über gezeichneter Sternumgebung ---------- */
function gnom(ra0,dec0,ra,dec){
  const a0=ra0*D2R,d0=dec0*D2R,a=ra*D2R,d=dec*D2R,c=Math.sin(d0)*Math.sin(d)+Math.cos(d0)*Math.cos(d)*Math.cos(a-a0);
  if(c<=0.01)return null;
  return [Math.cos(d)*Math.sin(a-a0)/c*R2D*60,(Math.cos(d0)*Math.sin(d)-Math.sin(d0)*Math.cos(d)*Math.cos(a-a0))/c*R2D*60];
}
function framingSvg(T,W){
  const f=fovArcmin(),Hh=Math.round(W*0.74),sizeMax=T.size?Math.max(T.size[0],T.size[1]):10;
  const span=Math.max(Math.hypot(f.w,f.h)*1.3,sizeMax*1.3,70),sc=W/span,cx=W/2,cy=Hh/2;
  let s='<svg width="'+W+'" height="'+Hh+'" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Bildfeld '+fmt(f.w,2)+' mal '+fmt(f.h,2)+' Bogenminuten über der Sternumgebung von '+esc(T.name)+'">';
  const rad=Math.hypot(W,Hh)/2/sc,gs=span>200?60:span>100?30:10;
  for(let k=-Math.ceil(W/2/(gs*sc));k<=Math.ceil(W/2/(gs*sc));k++){const x=cx+k*gs*sc;s+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="0" y2="'+Hh+'" style="stroke:rgba(var(--ink-rgb),.09)"/>';}
  for(let k=-Math.ceil(Hh/2/(gs*sc));k<=Math.ceil(Hh/2/(gs*sc));k++){const y=cy+k*gs*sc;s+='<line x1="0" x2="'+W+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" style="stroke:rgba(var(--ink-rgb),.09)"/>';}
  for(const st of H.sterne){
    if(Math.abs(st[1]-T.dec)>rad/60+0.2)continue;
    const g=gnom(T.ra,T.dec,st[0],st[1]);if(!g)continue;
    const x=cx-g[0]*sc,y=cy-g[1]*sc;if(x<-8||x>W+8||y<-8||y>Hh+8)continue;
    const r=clamp(1.3+(5.2-st[2])*1.35,1.4,7);
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'" style="fill:var(--ink)" fill-opacity=".92"/>';
  }
  for(const O of NV.targets){
    if(O===T)continue;const g=gnom(T.ra,T.dec,O.ra,O.dec);if(!g)continue;
    const x=cx-g[0]*sc,y=cy-g[1]*sc;if(x<8||x>W-8||y<8||y>Hh-8)continue;
    const rx=O.size?Math.max(3,O.size[0]/2*sc):3,ry=O.size?Math.max(3,O.size[1]/2*sc):3;
    s+='<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="'+Math.min(rx,W/3).toFixed(1)+'" ry="'+Math.min(ry,W/3).toFixed(1)+'" fill="none" style="stroke:var(--ink-3)" stroke-dasharray="3 3"/><text x="'+(x+6)+'" y="'+(y-6)+'" style="font-family:var(--font-ui);font-size:12px;fill:var(--ink-2)">'+esc(O.name.replace(/\s*\(.*\)$/,''))+'</text>';
  }
  if(T.size){s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(T.size[0]/2*sc).toFixed(1)+'" ry="'+(T.size[1]/2*sc).toFixed(1)+'" style="fill:var(--accent)" fill-opacity=".14" stroke-width="1.5" stroke-dasharray="5 3" stroke="var(--accent)"/>';}
  s+='<g transform="rotate('+(-S.pa)+' '+cx+' '+cy+')"><rect x="'+(cx-f.w/2*sc).toFixed(1)+'" y="'+(cy-f.h/2*sc).toFixed(1)+'" width="'+(f.w*sc).toFixed(1)+'" height="'+(f.h*sc).toFixed(1)+'" fill="none" style="stroke:var(--ink)" stroke-width="2.2"/>';
  s+='<path d="M'+(cx-5)+' '+cy+'h10M'+cx+' '+(cy-5)+'v10" style="stroke:var(--ink)" stroke-width="1.2"/>';
  s+='<text x="'+(cx-f.w/2*sc+5).toFixed(1)+'" y="'+(cy-f.h/2*sc+15).toFixed(1)+'" style="font-family:var(--font-mono);font-size:12px;fill:var(--ink)">'+fmt(f.w,2)+'′ × '+fmt(f.h,2)+'′</text></g>';
  const sb=span>200?60:span>100?30:10;
  s+='<g transform="translate(12 '+(Hh-14)+')"><path d="M0 0h'+(sb*sc).toFixed(1)+'M0 -4v8M'+(sb*sc).toFixed(1)+' -4v8" style="stroke:var(--ink-2)" stroke-width="1.4"/><text x="'+(sb*sc/2).toFixed(1)+'" y="-7" text-anchor="middle" style="font-family:var(--font-mono);font-size:11px;fill:var(--ink-2)">'+sb+'′</text></g>';
  s+='<g style="font-family:var(--font-ui);font-weight:600;font-size:13px;fill:var(--ink-2)"><text x="'+(W/2)+'" y="16" text-anchor="middle">N</text><text x="10" y="'+(Hh/2+4)+'">O</text></g>';
  return s+'</svg>';
}

    else{const sn=snapHeights(),h0=d.hist[0],h1=d.hist[d.hist.length-1],v=(h1[1]-h0[1])/Math.max(30,h1[0]-h0[0]);
      const proj=sheetH-v*140;let best='peek',bd=1e9;for(const k of ['peek','half','full']){const dd=Math.abs(sn[k]-proj);if(dd<bd){bd=dd;best=k;}}setSnap(best);}
    d=null;
  };
  head.addEventListener('pointerup',end);head.addEventListener('pointercancel',()=>{d=null;});
  $('#headline').addEventListener('click',e=>{
    if(e.target.closest('#playBtn')){S.playing=!S.playing;if(S.playing&&S.t>=960)S.t=0;syncPlay();playAcc=0;return;}

  });
})();

/* =========================================================
   Teil 4: Auswahl, Seiten (Ziele, Plan, Setup), Start
   ========================================================= */
function bestTimeFor(T){
  let best=null,run=null;
  for(let t=NV.d0;t<=NV.d1;t+=15){
    const ok=inWins(T.win,t)&&cloudClear(N,t);
    if(ok){if(!run)run=[t,t];else run[1]=t;}
    else if(run){if(!best||(run[1]-run[0])>(best[1]-best[0]))best=run;run=null;}
  }
  if(run&&(!best||(run[1]-run[0])>(best[1]-best[0])))best=run;
  if(best)return Math.round((best[0]+best[1])/10)*5;
  if(T.win.length)return Math.round((T.win[0][0]+T.win[0][1])/10)*5;
  return null;
}
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true;},3200);
}
function isMapTab(){return S.tab==='nacht'||S.tab==='himmel';}

/* ---------- Auswahl ---------- */
function selectTarget(i){
  S.sel=i;visKey='';
  if(i!=null&&isMapTab()&&S.snapName==='peek')setSnap('half');
  renderSheet();dirty=true;
}
function showInSky(i){
  const T=NV.targets[i];
  closeDetail();
  S.sel=i;
  const bt=bestTimeFor(T);
  const nowOk=inWins(T.win,S.t);
  if(bt!=null&&!nowOk)setTime(bt);
  if(S.tab!=='himmel'){setTab('himmel');}
  else{renderSheet();}
  if(S.snapName==='peek')setSnap('half');
  const alt=lerpArr(T.alt,S.t),az=lerpAz(T.az,S.t);
  S.view='frei';syncViewButtons();
  moveCam(az,clamp(alt,8,90),Math.max(cam.zoom,2.6),true);
  toast('Karte auf '+T.name+' zentriert');
}
function addToPlan(i){
  const T=NV.targets[i],plan=planOf(S.ni);
  const k=plan.findIndex(p=>p.ti===i);
  if(k>=0){plan.splice(k,1);toast(T.name+' aus dem Plan genommen');}
  else{
    let s,e;
    const bt=bestTimeFor(T);
    if(bt==null){toast(T.name+' hat in dieser Nacht kein Fenster');return;}
    s=bt;e=bt;
    s=Math.round(s/15)*15;e=s;
    while(s-15>=NV.p0&&inWins(T.win,s-15)&&cloudClear(N,s-15))s-=15;
    while(e+15<=NV.p1&&inWins(T.win,e+15)&&cloudClear(N,e+15))e+=15;
    if(e-s<45){e=Math.min(NV.p1,s+60);}
    plan.push({ti:i,s,e});plan.sort((a,b)=>a.s-b.s);S.planSel=plan.findIndex(p=>p.ti===i);
    toast(T.name+' zum Plan hinzugefügt ('+hhmm(s)+'–'+hhmm(e)+')');
  }
  S.exported=false;
  refreshDetailPlanButtons();
  if(S.tab==='plan')renderPlan();
}

function conflictsFor(it,plan){
  const T=NV.targets[it.ti],out=[];
  const runs=(pred)=>{const r=[];let cur=null;for(let t=it.s;t<it.e;t+=15){if(pred(t)){if(!cur)cur=[t,t+15];else cur[1]=t+15;}else if(cur){r.push(cur);cur=null;}}if(cur)r.push(cur);return r;};
  runs(t=>!cloudClear(N,t)).forEach(r=>out.push({k:'wolke',txt:'Wolken über '+CLOUD_LIM+' % von '+hhmm(r[0])+' bis '+hhmm(Math.min(r[1],it.e))}));
  runs(t=>!inWins(T.win,t)).forEach(r=>out.push({k:'maske',txt:'Außerhalb des Fensters von '+hhmm(r[0])+' bis '+hhmm(Math.min(r[1],it.e))+' (Horizont oder noch nicht dunkel)'}));
  plan.forEach(o=>{if(o!==it&&o.s<it.e&&o.e>it.s)out.push({k:'ueber',txt:'Überschneidet sich mit '+NV.targets[o.ti].name+' ('+hhmm(Math.max(o.s,it.s))+'–'+hhmm(Math.min(o.e,it.e))+')'});});
  return out;
}

function parseCoords(str){
  let s=String(str||'').trim();if(!s)return null;
  const at=s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  let lat,lon;
  if(at){lat=+at[1];lon=+at[2];}
  else{
    const south=/\bS\b|S\s*$|\d\s*°?\s*S\b/i.test(s)&&/[NS]/i.test(s),west=/[WO]?\s*W\b|\d\s*°?\s*W\b/i.test(s);
    const toks=(s.replace(/[°′″'"]/g,' ').match(/[-+]?\d+(?:[.,]\d+)?/g)||[]);
    if(toks.length!==2)return null;
    lat=parseFloat(toks[0].replace(',','.'));lon=parseFloat(toks[1].replace(',','.'));
    if(south&&lat>0)lat=-lat;if(west&&lon>0)lon=-lon;
  }
  if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return null;
  return {lat,lon};
}
function fmtCoord(v,pos,neg){return fmt(Math.abs(v),4)+'° '+(v>=0?pos:neg);}
function saveLocs(){store.set('locs',S.locs.filter(l=>!l.builtin));}
function maskPolar(sz){
  const c=sz/2,R=sz/2-32,rad=alt=>R*Math.tan((90-clamp(alt,0,90))*D2R/2);
  const P=(alt,az)=>[c-rad(alt)*Math.sin(az*D2R),c-rad(alt)*Math.cos(az*D2R)];
  const free=hzFreeTxt();
  let s='<svg id="hzEd" width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" role="img" aria-label="Horizontprofil von oben gesehen. '+esc(free)+'.'+(S.hzEdit?' Ziehen malt den Horizont: zur Mitte hin höher, nach außen tiefer.':'')+'" style="'+(S.hzEdit?'touch-action:none;cursor:crosshair':'')+'">';
  s+='<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="url(#hatchA)" fill-opacity=".55" style="stroke:var(--line-2)" stroke-width="1.4"/>';
  let d='';const pt=(al,az)=>{const p=P(al,az);d+=(d?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);};
  for(let az=0;az<360;az+=1){const h=hzAt(az),hn=hzAt(az+1);pt(h,az);if(h>=90&&hn<90)pt(90,az+1);else if(h<90&&hn>=90)pt(90,az);}
  s+='<path d="'+d+'Z" style="fill:var(--panel);stroke:var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>';
  [30,60].forEach(a=>{s+='<circle cx="'+c+'" cy="'+c+'" r="'+rad(a).toFixed(1)+'" fill="none" style="stroke:var(--line-2)" stroke-dasharray="3 4"/><text x="'+(c+4)+'" y="'+(c-rad(a)-3).toFixed(1)+'" style="font-family:var(--font-mono);font-size:10.5px;fill:var(--ink-3)">'+a+'°</text>';});
  for(let az=0;az<360;az+=45){const o=P(-9,az);const lab=['N','NO','O','SO','S','SW','W','NW'][az/45];
    s+='<text x="'+o[0].toFixed(1)+'" y="'+(o[1]+4).toFixed(1)+'" text-anchor="middle" style="font-family:var(--font-ui);font-weight:'+(az%90?500:700)+';font-size:'+(az%90?12:15)+'px;fill:'+(az%90?'var(--ink-3)':'var(--ink)')+'">'+lab+'</text>';}
  if(S.sel!=null&&NV){const T=NV.targets[S.sel];const pts=[];for(let k=Math.ceil(NV.d0/15);k<=Math.floor(NV.d1/15);k++){if(T.alt[k]>0){const p=P(T.alt[k],T.az[k]);pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}}
    if(pts.length>1)s+='<polyline fill="none" style="stroke:var(--ink)" stroke-width="2" stroke-dasharray="6 4" points="'+pts.join(' ')+'"/>';}
  s+='<circle cx="'+c+'" cy="'+c+'" r="2.5" style="fill:var(--ink)"/>';
  return s+'</svg>';
}
/* Freie Richtungen als kurzer Text, z. B. „frei 140°–285° ab 30°“ */
function hzFreeTxt(){
  const fr=[];let a=null;
  for(let k=0;k<=72;k++){const v=S.hz[k%72];if(v<90&&a==null)a=k;if((v>=90||k===72)&&a!=null){fr.push([a*5,(k-1)*5]);a=null;}}
  if(fr.length>1&&fr[0][0]===0&&fr[fr.length-1][1]===355){const l=fr.pop();fr[0]=[l[0],fr[0][1]+360];}
  if(!fr.length)return 'rundum verdeckt';
  const mn=Math.min(...S.hz.filter(v=>v<90)),mx=Math.max(...S.hz.filter(v=>v<90));
  const rng=fr.length===1&&fr[0][1]-fr[0][0]>=355?'frei rundum':'frei '+fr.map(r=>r[0]+'°–'+(r[1]%360)+'°').join(', ');
  return rng+(mn===mx?' ab '+fmt(mn,0)+'°':', Horizont '+fmt(mn,0)+'° bis '+fmt(mx,0)+'°');
}

function bindHzEditor(){
  const host=$('#maskSvg');if(!host)return;
  let on=false;
  const paint=e=>{
    const sv=$('#hzEd');if(!sv)return;const r=sv.getBoundingClientRect(),sz=r.width,c=sz/2,R=sz/2-32;
    const x=e.clientX-r.left-c,y=e.clientY-r.top-c,dist=Math.hypot(x,y);

  };

function sampTxt(f,fwhm){
  const bin=f.scale*2;
  if(fwhm>3.3)return 'Bei '+fmt(S.eq.seeing,1)+'″ Seeing überdeckt ein Stern etwa <b>'+fmt(fwhm,1)+' Pixel</b> (günstig sind 2 bis 3): leicht überabgetastet. Mit 2×2-Binning ('+fmt(bin,2)+'″/px, '+fmt(fwhm/2,1)+' px) passt es besser. Als Hinweis, nicht als Vorschrift.';
  if(fwhm<2)return 'Bei '+fmt(S.eq.seeing,1)+'″ Seeing ergeben sich nur etwa <b>'+fmt(fwhm,1)+' Pixel</b> pro Sternscheibchen: unterabgetastet, Auflösung geht verloren.';
  return 'Bei '+fmt(S.eq.seeing,1)+'″ Seeing überdeckt ein Stern etwa <b>'+fmt(fwhm,1)+' Pixel</b>: gut abgetastet.';
}

/* =========================================================
   Teil 5 (nur Web-Fassung): Wetter live holen statt eingebettet.
   Open-Meteo direkt (erlaubt Browser-Abrufe), 7Timer über wetter7.php auf demselben Server.
   Ergebnis je Ort eine Stunde im Browser zwischengespeichert, gleiche Form wie werkzeug/wetter_holen.py.
   ========================================================= */
const WX_TTL=3600000;
const WX_FELDER='cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,precipitation,precipitation_probability,relative_humidity_2m,temperature_2m,dew_point_2m,wind_speed_10m,wind_gusts_10m';
const runde=(a,k)=>a.map(v=>v==null?null:(k?Math.round(v*10)/10:Math.round(v)));
async function holeWetter(L,neu){
  const key='wx_'+L.id,c=store.get(key,null);
  if(!neu&&c&&c.lat===L.lat&&c.lon===L.lon&&Date.now()-Date.parse(c.abruf)<WX_TTL)return c;
  // past_days=1, damit auch der Abend der laufenden Nacht Werte hat
  const q=new URLSearchParams({latitude:L.lat,longitude:L.lon,hourly:WX_FELDER,timezone:'GMT',forecast_days:16,past_days:1,wind_speed_unit:'kmh'});
  if(L.h)q.set('elevation',L.h);
  const r=await fetch('https://api.open-meteo.com/v1/forecast?'+q);
  if(!r.ok)throw new Error('Open-Meteo '+r.status);
  const om=await r.json(),hz=om.hourly;
  const w={abruf:new Date().toISOString(),lat:L.lat,lon:L.lon,
    openmeteo:{start:hz.time[0]+':00Z',schritt_h:1,n:hz.time.length,gitter:[om.latitude,om.longitude],hoehe:om.elevation,
      wolken:runde(hz.cloud_cover),tief:runde(hz.cloud_cover_low),mittel:runde(hz.cloud_cover_mid),hoch:runde(hz.cloud_cover_high),
      regen:runde(hz.precipitation,1),regen_wkt:runde(hz.precipitation_probability),feuchte:runde(hz.relative_humidity_2m),
      temp:runde(hz.temperature_2m,1),taupunkt:runde(hz.dew_point_2m,1),wind:runde(hz.wind_speed_10m),boeen:runde(hz.wind_gusts_10m)},
    t7:null};
  try{ // Seeing und Transparenz sind ein Zusatz; ohne sie läuft der Rest weiter
    const t=await fetch('wetter7.php?lat='+L.lat.toFixed(2)+'&lon='+L.lon.toFixed(2));
    if(t.ok){const j=await t.json();if(j&&j.init&&j.dataseries){const s=j.init;
      w.t7={init:s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(8,10)+':00:00Z',schritt_h:3,
        punkte:j.dataseries.map(d=>d.timepoint),seeing:j.dataseries.map(d=>d.seeing),transparenz:j.dataseries.map(d=>d.transparency)};}}
  }catch(e){}
  store.set(key,w);
  return w;
}
let wxLauf=0;
/* Wetter für den gewählten Ort laden und die Woche neu rechnen, ohne Nacht und Uhrzeit zu verlieren */
async function wetterAktualisieren(neu){
  const L=curLoc(),lauf=++wxLauf;
  if(!L)return;
  const alt=store.get('wx_'+L.id,null);
  if(alt&&alt.lat===L.lat&&alt.lon===L.lon&&!NP.wetter.orte[L.id]){NP.wetter.orte[L.id]=alt;wxNeu();}
  try{
    const w=await holeWetter(L,neu);
    if(lauf!==wxLauf||L.id!==S.locSel)return;
    if(!L.h&&w.openmeteo.hoehe!=null){L.h=Math.round(w.openmeteo.hoehe);if(!L.builtin)saveLocs();}
    NP.wetter.orte[L.id]=w;wxNeu();
    if(neu)toast('Wetter aktualisiert ('+wxStamp(w)+')');
  }catch(e){
    console.warn('[Wetter]',e);
    toast(NP.wetter.orte[L.id]?'Wetter nicht erneuert, ohne Netz? Es gilt der Stand vom '+wxStamp(NP.wetter.orte[L.id])+'.':'Kein Wetter geladen, ohne Netz? Gezeigt wird nur die Astronomie.');
  }
}
function wxNeu(){
  const ni=S.ni,t=S.t,sel=S.sel!=null&&NV?NV.targets[S.sel].name:null,hadWx=NVS.some(V=>!V.noWx);
  computeWeek();buildAllNV();S.ni=ni;setNightData();S.t=t;
  if(sel){const k=NV.targets.findIndex(T=>T.name===sel);S.sel=k>=0?k:null;}
  bestNi=0;{let bs=-1;NVS.forEach((V,i)=>{const sc=V.noWx?-1:V.clearMin+V.bestClear*10;if(sc>bs){bs=sc;bestNi=i;}});if(bs<=0)bestNi=-1;}
  // Kommt das Wetter zum ersten Mal, springt die Ansicht wie beim Start auf die beste Nacht und deren beste Zeit
  if(!hadWx&&bestNi>=0&&S.sel==null){S.ni=bestNi;setNightData();const bt=bestTimeFor(NV.best);if(bt!=null&&NV.best.clearH>0)S.t=bt;}
  renderNights();renderSlider();if(isMapTab())renderSheet();renderPagesIfOpen();buildPop();dirty=true;uiDirty=true;
}
/* Ortswechsel und Rückkehr in die App laden das Wetter nach */
{const sl=selectLoc;selectLoc=function(id){sl(id);wetterAktualisieren(false);};}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wetterAktualisieren(false);});
wetterAktualisieren(false);
/* Installierbar und offline: Hintergrunddienst nur in sicherer Umgebung (https oder Chrome-Ausnahme) */
if('serviceWorker' in navigator&&window.isSecureContext){
  navigator.serviceWorker.register('sw.js').catch(e=>console.warn('[Offline]',e));
}

})();
